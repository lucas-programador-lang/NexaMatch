<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexaMatch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">NEXA<span>MATCH</span></div>
        <nav>
            <a href="#" class="active" onclick="changePage('descobrir', this)">Descobrir</a>
            <a href="#" onclick="changePage('matches', this)">Meus Matches <span class="nav-badge" id="matches-badge"></span></a>
            <a href="#" onclick="changePage('mensagens', this)">Mensagens <span class="nav-badge" id="messages-badge"></span></a>
            <a href="#" onclick="changePage('notificacoes', this)">Avisos <span class="nav-badge" id="notifications-badge"></span></a>
            <a href="#" onclick="changePage('perfil', this)">Meu Perfil</a>
        </nav>
    </header>

    <main>
        <!-- Página 1: Descobrir (Visível por padrão) -->
        <div id="page-descobrir" class="page-content">
            <div class="controls">
                <h1>Mural de Conexões</h1>
                <select id="location-filter">
                    <option value="all">Todo o Brasil</option>
                    <option value="ro">Porto Velho, RO</option>
                </select>
            </div>
            <!-- Filtro de gênero (o JavaScript monta os botões) -->
            <div id="discover-filter" class="gender-filter" role="group" aria-label="Filtrar por gênero"></div>
            <!-- O JavaScript vai inserir os cards aqui dentro -->
            <div id="profiles-grid" class="grid"></div>
        </div>

        <!-- Página 2: Meus Matches (Oculta por padrão) -->
        <div id="page-matches" class="page-content" style="display: none;">
            <h1>Meus Matches</h1>
            <!-- O JavaScript monta a lista aqui dentro -->
            <div id="matches-content"></div>
        </div>

        <!-- Página 3: Mensagens (Oculta por padrão) -->
        <div id="page-mensagens" class="page-content" style="display: none;">
            <h1>Mensagens</h1>
            <!-- O JavaScript monta a lista de conversas e o chat aqui dentro -->
            <div id="messages-content"></div>
        </div>

        <!-- Página: Notificações (quem curtiu você / quem deu match) -->
        <div id="page-notificacoes" class="page-content" style="display: none;">
            <h1>Notificações</h1>
            <div id="notifications-content"></div>
        </div>

        <!-- Página 4: Meu Perfil (Oculta por padrão) -->
        <div id="page-perfil" class="page-content" style="display: none;">
            <h1>Meu Perfil</h1>
            <!-- O JavaScript monta o perfil e o formulário aqui dentro -->
            <div id="my-profile"></div>
        </div>

        <!-- Página: Perfil da pessoa (aberta ao clicar em "Ver Perfil") -->
        <div id="page-perfil-pessoa" class="page-content" style="display: none;">
            <div id="profile-detail"></div>
        </div>
    </main>

    <!-- Aviso rápido (ex.: "Deu match!") -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="script.js"></script>
</body>
</html>
