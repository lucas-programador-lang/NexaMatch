<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexaMatch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">NEXA<span>MATCH</span></div>
        <nav>
            <a href="#" class="active" onclick="changePage('descobrir', this)">Descobrir</a>
            <a href="#" onclick="changePage('matches', this)">Meus Matches</a>
            <a href="#" onclick="changePage('mensagens', this)">Mensagens</a>
            <a href="#" onclick="changePage('perfil', this)">Meu Perfil</a>
        </nav>
    </header>

    <main>
        <!-- Página 1: Descobrir (Visível por padrão) -->
        <div id="page-descobrir" class="page-content">
            <div class="controls">
                <h1>Mural de Conexões</h1>
                <select id="location-filter">
                    <option value="all">Todo o Brasil</option>
                    <option value="ro">Porto Velho, RO</option>
                </select>
            </div>
            <!-- O JavaScript vai inserir os cards aqui dentro -->
            <div id="profiles-grid" class="grid"></div>
        </div>

        <!-- Página 2: Meus Matches (Oculta por padrão) -->
        <div id="page-matches" class="page-content" style="display: none;">
            <h1>Meus Matches</h1>
            <p style="color: var(--text-muted); margin-top: 1rem;">Você ainda não tem matches. Continue curtindo!</p>
        </div>

        <!-- Página 3: Mensagens (Oculta por padrão) -->
        <div id="page-mensagens" class="page-content" style="display: none;">
            <h1>Mensagens</h1>
            <p style="color: var(--text-muted); margin-top: 1rem;">Sua caixa de entrada está vazia.</p>
        </div>

        <!-- Página 4: Meu Perfil (Oculta por padrão) -->
        <div id="page-perfil" class="page-content" style="display: none;">
            <h1>Meu Perfil</h1>
            <p style="color: var(--text-muted); margin-top: 1rem;">As configurações da sua conta aparecerão aqui.</p>
        </div>

        <!-- Modal de Detalhes do Perfil -->
        <div id="profile-modal" class="modal-overlay" style="display: none;">
            <div class="modal-content">
                <button class="modal-close" onclick="closeModal()">×</button>
                <div id="modal-body"></div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
