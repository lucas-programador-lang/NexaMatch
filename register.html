<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar conta - NexaMatch</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">
  <div class="auth-shell">

    <aside class="auth-stage" aria-hidden="true">
      <div class="logo">NEXA<span>MATCH</span></div>
      <div class="orbs">
        <span class="orb orb-a"></span>
        <span class="orb orb-b"></span>
        <span class="orb-heart"></span>
      </div>
      <div class="stage-copy">
        <p class="stage-title">Seu próximo match começa aqui.</p>
        <p class="stage-text">Crie sua conta, monte seu perfil e comece a conhecer gente nova.</p>
      </div>
    </aside>

    <main class="auth-panel">
      <section class="auth-card">
        <h1>Criar conta</h1>
        <p class="sub">Leva menos de um minuto.</p>

        <form id="register-form" novalidate>
          <div class="field-box">
            <input type="text" id="name" name="name" placeholder=" " autocomplete="given-name" maxlength="40" required />
            <label for="name">Nome</label>
          </div>

          <div class="field-box">
            <input type="email" id="email" name="email" placeholder=" " autocomplete="email" required />
            <label for="email">E-mail</label>
          </div>

          <div class="field-box">
            <input type="password" id="password" name="password" placeholder=" " autocomplete="new-password" required />
            <label for="password">Senha</label>
            <button type="button" class="toggle-pass" aria-label="Mostrar senha" data-toggle="password">
              <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>

          <div class="strength" id="strength" data-level="0" aria-live="polite">
            <i></i><i></i><i></i><span>Mín. 6 caracteres</span>
          </div>

          <div class="field-box">
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder=" " autocomplete="new-password" required />
            <label for="confirmPassword">Confirmar senha</label>
          </div>

          <button type="submit" class="btn-primary">Criar conta</button>
          <div id="form-message" class="message" role="alert" hidden></div>
        </form>

        <p class="alt">Já tem conta? <a href="login.html">Entrar</a></p>
      </section>
    </main>

  </div>

  <script src="auth.js"></script>
</body>
</html>
